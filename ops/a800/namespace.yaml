apiVersion: v1
kind: Namespace
metadata:
  name: worldspec-a800-poc
  labels:
    app.kubernetes.io/name: worldspec-a800-poc
    app.kubernetes.io/part-of: worldspec
    app.kubernetes.io/managed-by: worldspec
    purpose: isolated-gpu-validation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worldspec-a800-runner
  namespace: worldspec-a800-poc
  labels:
    app.kubernetes.io/part-of: worldspec
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: worldspec-a800-poc-quota
  namespace: worldspec-a800-poc
  labels:
    app.kubernetes.io/part-of: worldspec
spec:
  hard:
    count/jobs.batch: "1"
    requests.cpu: "8"
    limits.cpu: "8"
    requests.memory: 32Gi
    limits.memory: 32Gi
    requests.ephemeral-storage: 80Gi
    limits.ephemeral-storage: 80Gi
    requests.nvidia.com/gpu: "1"
    limits.nvidia.com/gpu: "1"
