[workspace]
members = [
    "crates/worldspec-cli",
    "crates/worldspec-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
jsonschema = { version = "0.49.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
