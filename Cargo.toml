[workspace]
members = [
    "crates/worldspec-cas",
    "crates/worldspec-cert",
    "crates/worldspec-cli",
    "crates/worldspec-core",
    "crates/worldspec-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
axum = "0.8.4"
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
jsonschema = { version = "0.49.1", default-features = false }
jiff = "0.2.23"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
